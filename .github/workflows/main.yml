name: News
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
    inputs: { digest: { description: 'Enviar ya el resumen de las 8:00 (prueba)', type: boolean, default: false } }
  push: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write, models: read }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/lib.test.mjs
      - run: node scripts/build.mjs
        env:
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_DIGEST: ${{ inputs.digest }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: d
        uses: actions/deploy-pages@v4
